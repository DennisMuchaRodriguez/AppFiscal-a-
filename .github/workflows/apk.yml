# Cada vez que se sube un cambio, GitHub revisa el código, corre las pruebas,
# compila la app para Android (APK) y la publica en la página de "Releases"
# para descargarla desde el celular.
name: APK de prueba

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Revisar el código y correr las pruebas
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Compilar el APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=COMPILACION=${{ github.run_number }}

      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AppFiscal.apk
          gh release delete apk-prueba --yes --cleanup-tag || true
          gh release create apk-prueba AppFiscal.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "AppFiscal · compilación #${{ github.run_number }}" \
            --notes "Rama: ${{ github.ref_name }} · Commit: ${{ github.sha }}"
